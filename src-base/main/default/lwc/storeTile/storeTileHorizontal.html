<template>
  <div class="slds-media slds-media_center">
    <div class="slds-media__figure">
      <div class="store-image" style={backgroundImageStyle}></div>
    </div>
    <div class="slds-media__body">
      <h1 class="slds-text-heading_small">{value.Name}</h1>
      <p>{value.Address__City__s}</p>
      <p>{value.Cuisine__c}</p>
      <c-review-stars
        review-score={value.Average_Review_Score__c}
        number-of-reviews={value.Total_Reviews__c}
        display-mode="compact"
      ></c-review-stars>
    </div>
  </div>
</template>
